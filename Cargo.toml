[package]
name = "omena-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CME-coupled bridge surfaces for Omena semantic graph inputs"
repository = "https://github.com/omenien/omena-bridge"
readme = "README.md"

[lib]
name = "omena_bridge"

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
engine-input-producers = { package = "omena-engine-input-producers", git = "https://github.com/omenien/omena-engine-input-producers.git", rev = "9e4d29c" }
engine-style-parser = { package = "omena-engine-style-parser", git = "https://github.com/omenien/omena-engine-style-parser.git", rev = "4dcf39d" }
omena-semantic = { git = "https://github.com/omenien/omena-semantic.git", rev = "fc0a49f" }
serde = { version = "1.0", features = ["derive"] }

[patch.crates-io]
omena-engine-input-producers = { git = "https://github.com/omenien/omena-engine-input-producers.git", rev = "9e4d29c" }
omena-engine-style-parser = { git = "https://github.com/omenien/omena-engine-style-parser.git", rev = "4dcf39d" }
