[package]
name = "omena-bridge"
version = "0.1.9"
edition = "2024"
license = "MIT"
description = "CME-coupled bridge surfaces for Omena semantic graph inputs"
repository = "https://github.com/omenien/omena-bridge"
readme = "README.md"
keywords = ["omena", "css-modules", "semantic", "analysis"]
categories = ["development-tools"]
exclude = [".github/**"]

[lib]
name = "omena_bridge"

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
engine-input-producers = { package = "omena-engine-input-producers", git = "https://github.com/omenien/omena-engine-input-producers.git", rev = "7b08f67" }
engine-style-parser = { package = "omena-engine-style-parser", git = "https://github.com/omenien/omena-engine-style-parser.git", rev = "5e809bf" }
omena-semantic = { git = "https://github.com/omenien/omena-semantic.git", rev = "0508f29" }
oxc_allocator = "0.128.0"
oxc_ast = "0.128.0"
oxc_parser = "0.128.0"
oxc_span = "0.128.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
