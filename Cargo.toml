[package]
name = "omena-bridge"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "CME-coupled bridge surfaces for Omena semantic graph inputs"
repository = "https://github.com/omenien/omena-bridge"
readme = "README.md"
keywords = ["omena", "css-modules", "semantic", "analysis"]
categories = ["development-tools"]
exclude = [".github/**"]

[lib]
name = "omena_bridge"

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
engine-input-producers = { package = "omena-engine-input-producers", version = "0.1.2" }
engine-style-parser = { package = "omena-engine-style-parser", version = "0.1.2" }
omena-semantic = "0.1.5"
serde = { version = "1.0", features = ["derive"] }
